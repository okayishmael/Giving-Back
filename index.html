      :root {
        --bg: #eeeeee;
        --navy: #2d5143;
        --navy-light: #2d5143;
        --gold: #ae3a00;
        --gold-light: #e9c57b;
        --ink: #20242a;
        --muted: #5b6472;
        --card: #ffffff;
        --row-alt: #f6f6f4;
        --border: #dcdee2;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        font-family: "Poppins", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      header.top {
        background: linear-gradient(
          135deg,
          var(--navy) 0%,
          var(--navy-light) 100%
        );
        color: #fff;
        padding: 36px 20px 30px;
        text-align: center;
      }

      header.top h1 {
        margin: 0 0 8px;
        font-weight: 600;
        font-size: clamp(1.4rem, 3vw, 2.1rem);
        letter-spacing: -0.01em;
      }

      header.top p {
        margin: 0;
        font-weight: 300;
        font-size: 0.95rem;
        color: #d7deea;
        max-width: 640px;
        margin-inline: auto;
      }

      .eyebrow {
        display: inline-block;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--gold-light);
        margin-bottom: 10px;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }

      .picker-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px 22px;
        box-shadow: 0 2px 10px rgba(27, 51, 88, 0.08);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .picker-card label {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--navy);
        white-space: nowrap;
      }

      select#stateSelect {
        flex: 1;
        min-width: 200px;
        font-family: "Poppins", sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--ink);
        padding: 12px 40px 12px 14px;
        border-radius: 10px;
        border: 1.5px solid var(--border);
        background: #fff
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%231B3358" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>')
          no-repeat right 14px center / 16px;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      select#stateSelect:focus {
        outline: none;
        border-color: var(--navy);
        box-shadow: 0 0 0 3px rgba(27, 51, 88, 0.15);
      }

      .state-count {
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
      }

      #emptyState {
        background: var(--card);
        border-radius: var(--radius);
        padding: 60px 24px;
        text-align: center;
        color: var(--muted);
        box-shadow: 0 2px 10px rgba(27, 51, 88, 0.06);
      }

      #emptyState .icon {
        font-size: 2.2rem;
        display: block;
        margin-bottom: 10px;
      }

      #resultsWrap {
        display: none;
      }

      .state-heading {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 4px 0 16px;
        flex-wrap: wrap;
      }

      .state-heading h2 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        color: var(--navy);
      }

      .state-heading span {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 400;
      }

      .table-card {
        background: var(--card);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(27, 51, 88, 0.08);
      }

      table.np-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      table.np-table thead th {
        background: var(--navy);
        color: #fff;
        text-align: left;
        font-weight: 600;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 14px 18px;
      }

      table.np-table tbody td {
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        color: var(--ink);
      }

      table.np-table tbody tr:last-child td {
        border-bottom: none;
      }
      table.np-table tbody tr:nth-child(even) {
        background: var(--row-alt);
      }

      table.np-table td.name-cell {
        width: 20%;
        font-weight: 600;
      }
      table.np-table td.focus-cell {
        width: 16%;
      }
      table.np-table td.mission-cell {
        width: 48%;
        color: var(--muted);
        line-height: 1.5;
      }
      table.np-table td.donated-cell {
        width: 16%;
      }

      a.org-link {
        color: var(--navy);
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1.5px solid var(--gold);
        padding-bottom: 1px;
        transition: color 0.15s ease;
      }
      a.org-link:hover {
        color: var(--gold);
      }

      .focus-pill {
        display: inline-block;
        background: #eaf0fa;
        color: var(--navy);
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
      }

      .donated-badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 4px 12px;
        border-radius: 20px;
        background: #f5e4e4;
        color: #9b3b3b;
      }

      .donated-badge.is-yes {
        background: #e1f3e5;
        color: #2e7d42;
      }

      .cell-label {
        display: none;
      }

      footer.note {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 20px 40px;
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.6;
      }

      /* ---------- Tablet ---------- */
      @media (max-width: 1024px) {
        main {
          padding: 24px 16px 50px;
        }
        table.np-table td.mission-cell {
          width: 42%;
        }
        table.np-table thead th,
        table.np-table tbody td {
          padding: 12px 14px;
          font-size: 0.86rem;
        }
      }

      /* ---------- Mobile: stacked cards ---------- */
      @media (max-width: 640px) {
        header.top {
          padding: 28px 16px 24px;
        }
        .picker-card {
          flex-direction: column;
          align-items: stretch;
        }
        .picker-card label {
          margin-bottom: -6px;
        }
        .state-count {
          text-align: right;
        }

        table.np-table thead {
          display: none;
        }
        table.np-table,
        table.np-table tbody,
        table.np-table tr,
        table.np-table td {
          display: block;
          width: 100% !important;
        }
        table.np-table tbody tr {
          border-bottom: 8px solid var(--bg);
          padding: 14px 16px 16px;
        }
        table.np-table tbody tr:nth-child(even) {
          background: var(--card);
        }
        table.np-table tbody td {
          border-bottom: none;
          padding: 8px 0;
          display: flex;
          justify-content: space-between;
          gap: 12px;
          align-items: flex-start;
        }
        table.np-table td.mission-cell {
          flex-direction: column;
          align-items: flex-start;
        }
        .cell-label {
          display: block;
          font-size: 0.68rem;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          font-weight: 700;
          color: var(--gold);
          flex-shrink: 0;
          width: 90px;
        }
        table.np-table td.mission-cell .cell-label {

          margin-bottom: 4px;
        }

        table.np-table td.focus-cell,
        table.np-table td.donated-cell {
          text-align: right;
        }
        table.np-table td.mission-cell {
          text-align: left;
        }
      }
    </style>
  </head>

            name: "Volunteers of America Northern Rockies",
            url: "https://www.voa.org",
            focus: "Housing & Veteran Services",
            mission:
              "Provides housing assistance and veteran support services for people experiencing homelessness in Wyoming.",
            donated: "NO",
          },
        ],
      };

      /* ---------- Build dropdown ---------- */
      const select = document.getElementById("stateSelect");
      const states = Object.keys(DATA);
      states.forEach((st) => {
        const opt = document.createElement("option");
        opt.value = st;
        opt.textContent = st;
        select.appendChild(opt);
      });
      document.getElementById("stateCount").textContent =
        states.length + " states available";

      const emptyState = document.getElementById("emptyState");
      const resultsWrap = document.getElementById("resultsWrap");
      const stateNameEl = document.getElementById("stateName");
      const tbody = document.getElementById("tableBody");

      function renderState(stateName) {
        const orgs = DATA[stateName];
        if (!orgs) {
          emptyState.style.display = "block";
          resultsWrap.style.display = "none";
          return;
        }
        stateNameEl.textContent = stateName;
        tbody.innerHTML = orgs
          .map((org) => {
            const isYes = String(org.donated).trim().toUpperCase() === "YES";
            const badgeClass = "donated-badge" + (isYes ? " is-yes" : "");
            return `
    <tr>
      <td class="name-cell">
        <span class="cell-label">Name</span>
        <a class="org-link" href="${org.url}" target="_blank" rel="noopener noreferrer">${org.name}</a>
      </td>
      <td class="focus-cell">
        <span class="cell-label">Focus Area</span>
        <span class="focus-pill">${org.focus}</span>
      </td>
      <td class="mission-cell">
        <span class="cell-label">Mission Statement</span>
        <span>${org.mission}</span>
      </td>
      <td class="donated-cell">
        <span class="cell-label">Donated</span>
        <span class="${badgeClass}">${org.donated}</span>
      </td>
    </tr>
  `;
          })
          .join("");
        emptyState.style.display = "none";
        resultsWrap.style.display = "block";
      }

      select.addEventListener("change", (e) => {
        const val = e.target.value;
        if (val) {
          renderState(val);
        } else {
          emptyState.style.display = "block";
          resultsWrap.style.display = "none";
        }
      });
    </script>
  </body>
</html>
